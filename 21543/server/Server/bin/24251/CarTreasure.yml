car_treasure:
  enabled: true # 是否启用赛车夺宝活动；改 false 就关闭 24251 赛车夺宝请求
  disabled_result_code: 123 # enabled=false 时返回给客户端的结果码
  version: 20260501 # 配置版本，建议用活动开始日期
  activity_id: 202605 # 活动期ID；换一期活动就改这里，影响自选车保存隔离
  debug_fixed_draw: false # 是否强制使用抓包固定十连样本；正式服必须 false，否则十连每次一样
  note: 正式运行配置；完整抓包样本见 24251/CarTreasure.sample.full.yml
  protocol:
    quickrpc_msgid: 24251 # QuickRPC 外层消息号
    cfg_cmd: Co.RequestGetCarTreasureCfg # 打开界面/刷新配置接口
    award_cmd: Co.RequestGetCarTreasureAward # 抽奖/分解接口
    select_cmd: Co.Beta80_RequestSelectGroupIndex # 自选车保存接口
    pre_box_msgid: 24465 # 兑换箱展示消息号
    get_box_msgid: 24466 # 点击兑换/领取消息号
  time:
    open_date: 20260501 # 活动开始日期 YYYYMMDD
    open_time: 0 # 活动开始时间 HHMMSS，0表示00:00:00
    close_date: 20261231 # 活动结束日期 YYYYMMDD
    close_time: 235959 # 活动结束时间 HHMMSS
  cost:
    item_id: 99662 # 抽奖消耗道具ID，老版夺宝券
    once: 1 # 单抽消耗数量
    ten: 10 # 十连消耗数量
    ten_after_discount: 10 # 折扣后十连消耗数量
    no_ticket_result_code: 123 # 券不足时返回给客户端的错误码
  discount:
    begin_date: 20230528
    begin_time: 155959
    close_date: 20230528
    close_time: 160000
    ten: 8
  exchange:
    piece_item_id: 94880 # 分解/兑换能量道具ID
  select_car:
    enabled: true # 是否启用自选车流程
    need_to_select_default: true # 未保存自选车时是否强制先选车
    s_count: 6 # S车可选数量；从下方S车列表中选择6辆
    t_count: 2 # T车可选数量；从下方T车列表中选择2辆
    a_count: 2 # A车可选数量；从下方A车列表中选择1辆
    can_reset: 0 # 是否允许客户端重置自选，0=不允许
  client_flags:
    can_open_summer_car_treasure: 0
    skin1_is_open: 12376
    skin2_is_open: 12376
    skin3_is_open: 12376
    coupons_index: 0
  operations:
    draw: 0 # 抽奖操作码
    decompose: 2 # 分解操作码
    draw_count_once: 1 # 单抽次数
    draw_count_ten: 10 # 十连次数
  award_pool:
    defaults: # award_pool.items 里没写的字段走这里；item_type/other_attribute/group 服务端自动补
