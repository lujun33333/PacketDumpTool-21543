# 绘梦人生 / Beta101 DrawDream 运营配置（单文件版）
# 说明：你不想拆文件，所以活动规则、奖池、兑换、礼包全部合并在这一份。
# 改法：先改上面的 cost/draw；下面三块就是三张运营表：award_pool、exchange_shop、gift_packs。
# 完整官方解码大文件保留：24251/HuimengDream.full.official_20260519_1719.yml

huimeng_dream:
  enabled: true
  activity_id: 20260501
  prefer_official_raw: true  # UI 继续用官方 raw 防白屏；业务逻辑走下面配置
  disabled_result_code: 1

  business:
    title: "绘梦人生"
    owner_note: "单文件商业运营版：不要找别的 YML，奖池/兑换/礼包都在本文件下面。"
    ticket: { item_id: 168306, name: "绘梦卡券" }
    piece:  { item_id: 168308, name: "绘梦积分" }

  protocol:
    quickrpc_msgid: 24251
    info_cmd: Co.ReqBeta101DrawDreamInfo
    award_cmd: Co.ReqBeta101DrawDreamAwardOpt

  time:
    open_date: 20260501
    open_time: 0
    close_date: 20260630
    close_time: 235959
    award_close_date: 20260630
    award_close_time: 235959

  cost:
    item_id: 168306        # 绘梦卡券
    piece_item_id: 168308  # 绘梦积分/兑换消耗
    fenjie_item_id: 168308 # 分解返还积分
    once: 1              # 单抽消耗几张卡券
    ten: 10
    fifty: 50
    strict_draw_cost: true # true=卡券不足不能抽
    buy_card_free: false   # false=购买礼包扣 BaseInfo.SuperMoney 点券；true=免费发卡券
    charge_currency: supermoney # 当前源码的“点券”字段是 BaseInfo.SuperMoney / Client->SuperMoney

  ops:
    draw_once: 1
    decompose: 2
    claim: 3
    progress_claim: 4   # 进度奖励领取
    exchange: 5
    temp_box: 6
    gift: 9
    buy_card: 10

  draw:
    store_to_temp: true # 抽中先进入暂存箱
    guarantee_final_at: 50 # 保底预留
    baoji_base_count: 50  # 每 50 次累计 1 个绘梦画笔/展台次数
    use_replay_draws: false # false=不固定首抽，按奖池权重随机
    replay_draws:
      # 固定首抽/前几抽；不想固定就删掉列表。
      - draw_no: 1
        name: "潮动足球发饰"
        award_idx: 79
        item_id: 141197
        item_num: 1
        item_type: 1
        avail_period: 168 # 168天

