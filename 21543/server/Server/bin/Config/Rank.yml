    ranked_coin_item_id: 89687 # 当前服务端背包中的排位币物品ID
    weekly_factory_coin_limit: 400 # 每周赛车工厂币上限
    special_tip: "达到绝影星耀段位解锁特殊特效" # 段位特殊提示文字
