rank:
  enabled: true # 排位总开关

  matchmaking: # 实际排位队列；原ASpeedConfig.yml的GameConfig.rankset已迁移到这里
    minimum_players: 2    # 队列达到1人即可开局，即支持单人排位
    man_machine:
      enabled: false # 是否启用原排位人机分支
      wait_seconds: 0 # 等待多少秒后进入人机分支

  season:
    id: 56 # msg25000赛季ID
    name: "极速狂飙" # msg25000赛季名称，当前客户端字段固定20字节
    background_scene_id: 189 # 排位主界面的背景场景ID
    open_date: 20260702 # 赛季开始日期，格式YYYYMMDD
    close_date: 20260827 # 赛季结束日期，格式YYYYMMDD
    open_times: # 每日开放时段，格式HHMMSS；msg25000展示和实际排位入口共用
      - [90000, 240000] # 09:00:00到24:00:00
      - [0, 20000] # 次日00:00:00到02:00:00

  maps:
    # 实际匹配/禁图按房间玩家当前段位选池：单人取本人段位，多人混排取最高段位；技术车神沿用grade 26。
    grades: # msg25000赛季地图；顺序来自当前21543客户端结构
      - grade: 20 # 青铜
        normal: [145, 158, 162, 238, 253, 255, 256, 260, 268, 273, 330, 420, 458, 261, 124, 132, 166, 175, 184, 191, 199, 202, 208, 219] # 普通排位地图
        super: [] # 超级排位地图
        factory: [273, 238, 261] # 赛车工厂地图
        new: [] # 本赛季新地图
      - grade: 21 # 白银
        normal: [145, 158, 162, 238, 253, 255, 256, 260, 261, 267, 268, 273, 323, 330, 420, 458, 124, 132, 166, 175, 184, 191, 199, 202, 208, 219]
        super: []
        factory: [273, 238, 261]
        new: []
      - grade: 22 # 黄金
        normal: [158, 162, 238, 253, 255, 256, 260, 261, 267, 268, 273, 278, 299, 323, 330, 389, 420, 421, 458, 462, 187, 374, 406, 427, 430, 435, 124, 132, 166, 175, 184, 191, 199, 202, 208, 219]
        super: []
        factory: [261, 187, 389, 435]
        new: [462]
      - grade: 23 # 铂金
        normal: [187, 278, 421, 427, 238, 246, 253, 256, 260, 261, 267, 268, 299, 323, 330, 374, 389, 395, 400, 406, 462, 376, 404, 430, 439, 422, 435, 124, 132, 166, 175, 184, 191, 199, 202, 208, 219]
        super: []
        factory: [187, 389, 435]
        new: [462]
      - grade: 24 # 钻石
        normal: [283, 396, 397, 429, 430, 376, 404, 415, 439, 466, 246, 261, 267, 278, 299, 323, 374, 389, 395, 400, 406, 421, 422, 427, 462, 438, 185, 189, 254, 262, 187, 435, 124, 132, 166, 175, 184, 191, 199, 202, 208, 219]
        super: []
        factory: [187, 389, 435]
        new: [462, 466]
      - grade: 25 # 星耀
        normal: [181, 194, 212, 231, 254, 266, 122, 185, 189, 262, 397, 167, 422, 429, 267, 283, 376, 389, 396, 415, 427, 430, 438, 439, 466, 394, 276, 393, 123, 133, 222, 329, 339, 435, 124, 132, 166, 175, 184, 191, 199, 202, 208, 219]
        super: [158, 162, 187, 238, 253, 255, 256, 260, 261, 267, 273, 278, 299, 330]
        factory: [435, 276, 222, 194]
        new: [466]
      - grade: 26 # 车神
        normal: [283, 346, 394, 396, 397, 404, 427, 439, 137, 167, 189, 238, 262, 376, 422, 429, 122, 123, 133, 194, 212, 254, 292, 339, 181, 185, 222, 231, 266, 276, 329, 332, 393, 441, 466, 153, 446, 448, 124, 132, 166, 175, 184, 191, 199, 202, 208, 219]
        super: []
        factory: []
        new: []

  # stages按书写顺序连接；children按书写顺序晋级，例如[3,2,1]表示III -> II -> I。
  # 普通段位默认进入晋级赛；大师段位mode=direct，达到门槛后直接升段并保留实际GradeScore。
  progression:
    stages:
      - {grade: 20, children: [3, 2, 1], score: 20} # 热血青铜
      - {grade: 21, children: [3, 2, 1], score: 30} # 迅捷白银
      - {grade: 22, children: [4, 3, 2, 1], score: 40} # 疾风黄金
      - {grade: 23, children: [5, 4, 3, 2, 1], score: 50} # 幻影铂金
      - {grade: 24, children: [5, 4, 3, 2, 1], score: 60} # 流星钻石
      - {grade: 25, children: [5, 4, 3, 2, 1], score: 60} # 绝影星耀

      # 大师积分为连续实际分数：299分获得+10后按309分晋级，不截断、不清零。
      - {grade: 26, children: [3], score: 300, mode: direct} # 技术大师：达到300分晋级超凡大师
      - {grade: 26, children: [2], score: 650, mode: direct} # 超凡大师：达到650分晋级荣耀大师
      - {grade: 26, children: [1], mode: leaderboard} # 荣耀大师：满足排行榜条件后晋级技术车神
      - {grade: 27, children: [1], mode: leaderboard_member} # 技术车神

    master_leaderboard:
      score_field: grade_score # 大师积分使用GradeScore，不使用赛季TotalScore
      top_rank: 10 # 只有荣耀大师且排名前10才能晋级技术车神
      demote_when_out: true # 掉出前10后回到荣耀大师，实际积分保持不变

  # 官服Msg513已见实包：完赛第1名RankAdd=4、第2名=3，另有FinishAdd=1；
  # 未完赛第3名RankAdd=-3、第4名=-4。当前在这些样本的名次分基础上，所有结果统一额外+3分。
  scoring:
    minimum_players_for_points: 1 # 设为1时单人排位也正常加分；若要禁止单人刷分可改为2
    finish_bonus: 1
    finished: {base: 8, per_rank: -1} # 第1至6名RankAdd依次为7,6,5,4,3,2
    unfinished: {base: 3, per_rank: -1} # 未完成第1至6名RankAdd依次为2,1,0,-1,-2,-3

  display:
    feishi_id: 174966 # 排位冲级奖励页飞饰ID
    feishi_desc: "铂金 30天  钻石 永久\n星耀解锁专属特效"
    shop_preview: # 排位首页商城预览物品
      - label: 6
        item: 174491
      - label: 5
