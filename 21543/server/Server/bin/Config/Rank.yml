    season_new_map_ids: [462, 466] # 赛季新地图ID列表
    super_race_grade_limit: 23 # 超级排位最低段位
    next_grade_season_task: 5636 # 下一段位对应的赛季任务ID
    top_race_min_open_season_id: 41 # 巅峰赛功能允许开放的最小赛季ID
    top_race_open_date: 20260709 # 本赛季巅峰赛开放日期

  mission:
    season_tasks: [4726, 4727] # msg25000赛季任务ID
    rank_tasks: [4723, 4724, 4725] # msg25000排位任务ID

