# CharmValue: 达到该等级所需魅力值
# SearchTreasure: 寻宝次数
# GetTreasure: 获取宝藏次数 (默认0)
# CritCard: 暴击卡次数 (默认0)
# MechLarger: 机械放大卡次数 (默认0)
# MallBuy: 商城购买等级 (默认=等级序号)
# Items: 达到等级可领取的奖品列表
#   ItemId: 道具ID
#   ItemNum: 道具数量
#   AvailPeriod: 有效期(天), 0=永久

