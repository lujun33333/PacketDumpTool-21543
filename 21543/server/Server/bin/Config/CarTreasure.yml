car_treasure: # 赛车夺宝活动总配置，服务端启动或热更新时读取这一层
  enabled: false # 是否启用赛车夺宝活动
  config_version: 20260501 # 配置版本号，建议用活动开始日期，方便热更判断
  source_pcap_group: "dll/pcaps/9" # 数据来源说明，方便追踪这份配置来自哪组抓包
  protocol: # 当前客户端协议方法名配置
    quickrpc_msgid: 24251 # QuickRPC 内层 MsgID，十进制 24251，十六进制 0x5EBB
    response_method: "DispatchCoResponse" # 服务端响应客户端时使用的方法名
    cfg_method: "Co.RequestGetCarTreasureCfg" # 客户端请求赛车夺宝配置的方法名，当前实包真实值
    award_method: "Co.RequestGetCarTreasureAward" # 客户端请求抽奖或分解的方法名，当前实包真实值
    select_method: "Co.Beta80_RequestSelectGroupIndex" # 客户端提交自选车组的方法名，当前实包真实值

  activity_time: # 活动时间配置，对应配置响应里的 iOpenDate/iOpenTime/iCloseDate/iCloseTime
    open_date: 20260501 # 活动开始日期，格式 yyyymmdd，写入客户端字段 iOpenDate
    open_time: 0 # 活动开始时间，格式 hhmmss，写入客户端字段 iOpenTime
    close_date: 20260531 # 活动结束日期，格式 yyyymmdd，写入客户端字段 iCloseDate
    close_time: 235959 # 活动结束时间，格式 hhmmss，写入客户端字段 iCloseTime

  cost: # 抽奖消耗配置，对应客户端消耗字段
    item_id: 99662 # 夺宝券道具 ID，写入 iCostItemID
    once_cost: 1 # 单抽消耗夺宝券数量，写入 iCostNumOneTime
    ten_cost: 10 # 十连抽消耗夺宝券数量，写入 iCaostNumTenTime，字段名沿用客户端拼写 Caost
    ten_cost_after_discount: 10 # 折扣后十连抽消耗数量，写入 iCaostNumTenTimeAfterDiscount
    no_ticket_result_code: 123 # 夺宝券不足时返回的 DispatchCoResponse 结果码，实包为 123

  discount: # 折扣配置，当前实包有字段但 UseDiscountNum 为 0
    begin_date: 20230528 # 折扣开始日期，写入 iDiscountBeginDate
    begin_time: 155959 # 折扣开始时间，写入 iDiscountBeginTime
    close_date: 20230528 # 折扣结束日期，写入 iDiscountCloseDate
    close_time: 160000 # 折扣结束时间，写入 iDiscountCloseTime
    ten_cost: 8 # 折扣十连消耗数量，写入 iDiscountCostNumTenTime
    used_count: 0 # 玩家已使用折扣次数，默认写 0，动态字段可按玩家覆盖
    score_discount_cfg: [] # 积分折扣配置表，当前实包为空数组

  exchange: # 分解/兑换能量配置
    piece_item_id: 94880 # 分解后获得的能量/碎片道具 ID，写入 iExchangePieceItemID，当前为 94880
    ret_com_table_from_db: true # RetComItemTable 是否从玩家暂存箱数据库动态生成
    ret_decp_table_from_db: true # RetDecpItemTable 是否从玩家分解记录数据库动态生成
    ret_rec_table_from_db: true # RetRecItemTable 是否从玩家领取记录数据库动态生成，当前实包为空

  select_car: # 自选车配置，当前新版实包需要这一块，老 NoSelfSelect 没有
    enabled: true # 是否启用自选车流程，当前实包存在 Co.Beta80_RequestSelectGroupIndex
    need_to_select_default: true # 未选择车辆时是否要求先选车，写入 iNeedToSelectCar，首次打开实包为 1
    need_to_select_after_selected: false # 玩家已提交选择后是否还需要选车，选车后实包为 0
    s_car_can_select_num: 2 # S 车可选数量，写入 iSCarCanSelectNum
    t_car_can_select_num: 2 # T 车可选数量，写入 iTCarCanSelectNum
    a_car_can_select_num: 7 # A 车可选数量，写入 iACarCanSelectNum
    can_reset_select: 0 # 是否允许重置选择，写入 iCanResetSelect
    already_select_from_db: true # iAlreadySelectCarGroupIndex 是否从玩家已选组数据库动态生成
    sample_selected_groups: # 当前抓包里的选车请求样本，服务端实装时按玩家提交保存
      - slot: 1 # 第 1 个选择槽位
        group_index: 1 # 该槽位选择的奖池组索引
      - slot: 2 # 第 2 个选择槽位
        group_index: 2 # 该槽位选择的奖池组索引
      - slot: 3 # 第 3 个选择槽位
        group_index: 14 # 该槽位选择的奖池组索引
      - slot: 4 # 第 4 个选择槽位
        group_index: 13 # 该槽位选择的奖池组索引
      - slot: 5 # 第 5 个选择槽位
        group_index: 15 # 该槽位选择的奖池组索引
      - slot: 6 # 第 6 个选择槽位
        group_index: 16 # 该槽位选择的奖池组索引
      - slot: 7 # 第 7 个选择槽位
        group_index: 17 # 该槽位选择的奖池组索引
      - slot: 8 # 第 8 个选择槽位
        group_index: 18 # 该槽位选择的奖池组索引
      - slot: 9 # 第 9 个选择槽位
        group_index: 19 # 该槽位选择的奖池组索引
      - slot: 10 # 第 10 个选择槽位
        group_index: 20 # 该槽位选择的奖池组索引
      - slot: 11 # 第 11 个选择槽位
        group_index: 21 # 该槽位选择的奖池组索引

  client_flags: # 客户端显示/开关字段，当前实包需要返回
    can_open_summer_car_treasure: 0 # 是否打开夏日赛车夺宝入口，写入 iCanOpenSummerCarTreasure
    skin1_is_open: 12376 # 皮肤入口 1 开关值，按实包原样返回
    skin2_is_open: 12376 # 皮肤入口 2 开关值，按实包原样返回
    skin3_is_open: 12376 # 皮肤入口 3 开关值，按实包原样返回
    coupons_index: 0 # 点券/券索引字段，按实包原样返回

  operations: # RequestGetCarTreasureAward 的操作码配置
    draw_op: 0 # 抽奖操作码，当前实包请求 [0, 10]
    decompose_op: 2 # 分解操作码，当前实包请求 [2, itemArray]
    draw_count_once: 1 # 单抽次数，服务端可支持 [0, 1]
    draw_count_ten: 10 # 十连次数，当前实包使用 [0, 10]
    decompose_allow_batch: true # 是否允许批量分解，当前实包已验证批量分解成功

  response_tables: # 配置响应中的动态表开关
    ret_com_item_table: "db_player_car_treasure_temp_box" # 暂存箱表 RetComItemTable 的数据来源
    ret_decp_item_table: "db_player_car_treasure_decompose_log" # 分解记录表 RetDecpItemTable 的数据来源
    ret_rec_item_table: "db_player_car_treasure_receive_log" # 领取记录表 RetRecItemTable 的数据来源

