<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QQ飞车登录器更新</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        color: #f7f7ff;
        background: radial-gradient(circle at 50% 0%, #3c348f, #17133f 68%);
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
        user-select: none;
      }
      main { width: 100%; padding: 30px 42px; text-align: center; }
      .spinner {
        width: 40px;
        height: 40px;
        margin: 0 auto 20px;
        border: 4px solid rgba(255, 255, 255, 0.22);
        border-top-color: #38d8ff;
        border-radius: 50%;
        animation: spin 0.85s linear infinite;
      }
      h1 { margin: 0 0 10px; font-size: 21px; font-weight: 650; }
      p { min-height: 25px; margin: 0; color: #c7c4ed; font-size: 14px; line-height: 1.75; }
      .progress-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 22px;
      }
      .progress-track {
        position: relative;
        flex: 1;
        height: 10px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        background: rgba(5, 7, 35, 0.42);
        box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.35);
      }
      .progress-fill {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #37d7ff, #71ffe1);
        box-shadow: 0 0 14px rgba(55, 215, 255, 0.65);
        transition: width 180ms ease;
      }
      .progress-track.is-indeterminate .progress-fill {
        width: 36%;
        animation: progress-slide 1.1s ease-in-out infinite;
      }
      .progress-percent {
        width: 48px;
        color: #f7f7ff;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes progress-slide {
        from { transform: translateX(-120%); }
        to { transform: translateX(300%); }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="spinner" aria-hidden="true"></div>
      <h1 data-update-title>正在检查登录器更新</h1>
      <p data-update-detail>正在连接更新服务器，请稍候。</p>
      <div class="progress-row">
        <div
          class="progress-track is-indeterminate"
          data-update-progress
          role="progressbar"
          aria-label="登录器更新进度"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <div class="progress-fill" data-update-progress-fill></div>
        </div>
        <span class="progress-percent" data-update-percent>检查中</span>
      </div>
    </main>
    <script type="module" src="./update.js"></script>
  </body>
</html>
